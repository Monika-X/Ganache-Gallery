<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create VIP Client Account | Ganache Gallery</title>
  <meta name="description" content="Register for a Ganache Gallery VIP account to book private tasting suites, request custom dessert proposals, and access private atelier collections.">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-secondary); padding: 2.5rem 1rem; position: relative;">

  <!-- TOP RIGHT CONTROLS -->
  <div class="top-right-controls">
    <button class="icon-btn theme-toggle" title="Toggle Light/Dark Mode"><i class="fa-solid fa-moon"></i></button>
    <button class="rtl-toggle-btn rtl-toggle" title="Toggle Text Orientation">RTL</button>
  </div>

  <div style="width: 100%; max-width: 480px; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 3rem 2.5rem; box-shadow: var(--shadow-lg); text-align: center; position: relative;">
    
    <!-- Brand Logo -->
    <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 2rem; display: inline-flex;">
      <div class="brand-logo-icon"><i class="fa-solid fa-cake-candles"></i></div>
      <div class="brand-text" style="text-align: left;">
        <div class="brand-title">Ganache <span>Gallery</span></div>
        <span class="brand-tagline">Haute Couture Desserts & Bespoke Cakes</span>
      </div>
    </a>

    <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem; font-family: var(--font-serif);">Join The Private List</h1>
    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2rem;">Register your VIP account for private tasting invites and bespoke cake consultations.</p>

    <form onsubmit="event.preventDefault(); alert('Welcome to Ganache Gallery VIP Portal! Account created successfully.'); window.location.href='user-dashboard.html';">
      <div class="form-group" style="text-align: left;">
        <label class="form-label">Full Name *</label>
        <input type="text" class="form-control" placeholder="Lady Genevieve Vance" required style="border-radius: var(--radius-sm);">
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label">Email Address *</label>
        <input type="email" class="form-control" placeholder="genevieve@atelier.com" required style="border-radius: var(--radius-sm);">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left;">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" class="form-control" placeholder="••••••••••••" required style="border-radius: var(--radius-sm);">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" class="form-control" placeholder="••••••••••••" required style="border-radius: var(--radius-sm);">
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 1.8rem; text-align: left;">
        <input type="checkbox" id="terms-agree" required style="accent-color: var(--color-champagne-gold); width: 16px; height: 16px; margin-top: 3px; cursor: pointer;">
        <label for="terms-agree" style="font-size: 0.82rem; color: var(--text-muted); cursor: pointer; line-height: 1.4;">I agree to the <a href="terms-and-conditions.html" style="color: var(--color-champagne-gold);">Terms & Conditions</a> and <a href="privacy-policy.html" style="color: var(--color-champagne-gold);">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">Create VIP Account <i class="fa-solid fa-user-plus"></i></button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" style="color: var(--color-champagne-gold); font-weight: 700;">Sign In</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
