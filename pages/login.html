<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client & Patron Login | Ganache Gallery</title>
  <meta name="description" content="Sign in to your Ganache Gallery VIP account to track custom cake orders, manage tasting bookings, and view bespoke design proposals.">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-secondary); padding: 2rem 1rem; position: relative;">

  <!-- TOP RIGHT CONTROLS -->
  <div class="top-right-controls">
    <button class="icon-btn theme-toggle" title="Toggle Light/Dark Mode"><i class="fa-solid fa-moon"></i></button>
    <button class="rtl-toggle-btn rtl-toggle" title="Toggle Text Orientation">RTL</button>
  </div>

  <div style="width: 100%; max-width: 440px; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 3rem 2.5rem; box-shadow: var(--shadow-lg); text-align: center; position: relative;">
    
    <!-- Brand Logo -->
    <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 2rem; display: inline-flex;">
      <div class="brand-logo-icon"><i class="fa-solid fa-cake-candles"></i></div>
      <div class="brand-text" style="text-align: left;">
        <div class="brand-title">Ganache <span>Gallery</span></div>
        <span class="brand-tagline">Haute Couture Desserts & Bespoke Cakes</span>
      </div>
    </a>

    <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem; font-family: var(--font-serif);">Client Portal Sign In</h1>
    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2rem;">Access your VIP tasting reservations, design briefs, and order timeline.</p>

    <form onsubmit="event.preventDefault(); window.location.href='user-dashboard.html';">
      <div class="form-group" style="text-align: left;">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="vance@atelier.com" value="lady.genevieve@gallery.com" required style="border-radius: var(--radius-sm);">
      </div>

      <div class="form-group" style="text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="#" style="font-size: 0.78rem; color: var(--color-champagne-gold);" onclick="alert('Password reset link sent to your email.'); return false;">Forgot Password?</a>
        </div>
        <input type="password" class="form-control" value="••••••••••••" required style="border-radius: var(--radius-sm);">
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.8rem; text-align: left;">
        <input type="checkbox" id="remember-me" checked style="accent-color: var(--color-champagne-gold); width: 16px; height: 16px; cursor: pointer;">
        <label for="remember-me" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">Keep me signed in for 30 days</label>
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">Sign In to Client Portal <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 0.88rem; color: var(--text-muted);">
      Don't have an atelier account? <a href="signup.html" style="color: var(--color-champagne-gold); font-weight: 700;">Create Account</a>
    </div>
    
    <div style="margin-top: 1rem; font-size: 0.8rem;">
      <a href="admin-dashboard.html" style="color: var(--text-muted); text-decoration: underline;">Switch to Atelier Admin Portal &rarr;</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
