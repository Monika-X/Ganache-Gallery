<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login | Ganache Gallery</title>
  <meta name="description" content="Sign in to your Ganache Gallery client portal to track consultations, tasting bookings, and private orders.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- AUTH PILL — Theme + RTL toggles (pill, top-right corner) -->
  <div class="auth-pill">
    <button class="icon-btn theme-toggle" title="Toggle Light/Dark Mode" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    <button class="rtl-toggle-btn rtl-toggle" title="Toggle Text Orientation" aria-label="Toggle RTL">RTL</button>
  </div>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="container">
      <h1 class="page-hero-title">Welcome Back</h1>
      <div class="breadcrumb">
        <a href="../index.html">Home</a>
        <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i>
        <span>Client Login</span>
      </div>
    </div>
  </section>

  <!-- LOGIN SECTION -->
  <section class="section-padding auth-section">
    <div class="container">
      <a href="../index.html" class="brand-logo auth-brand-logo" aria-label="Ganache Gallery — Home">
        <div class="brand-logo-icon"><i class="fa-solid fa-cake-candles"></i></div>
        <div class="brand-text">
          <div class="brand-title">Ganache <span>Gallery</span></div>
          <span class="brand-tagline">Haute Couture Desserts & Bespoke Cakes</span>
        </div>
      </a>
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon"><i class="fa-solid fa-user-lock"></i></div>
          <span class="tag-label">Client Portal</span>
          <h2 class="section-title" style="margin-top: 0.5rem;">Sign In To Your Account</h2>
          <p class="auth-subtitle">Track your bespoke consultations, tasting bookings, and private orders.</p>
        </div>

        <form class="auth-form" id="login-form">
          <div class="auth-field">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="auth-field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
          </div>

          <div class="auth-row">
            <label class="auth-check">
              <input type="checkbox" name="remember"> <span>Remember me</span>
            </label>
            <a href="#" class="auth-link" title="Password reset coming soon">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-gold auth-submit">Sign In <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <div class="auth-switch">
          <p>New to Ganache Gallery?</p>
          <a href="signup.html" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.85rem; font-weight: 700;">Create Account <i class="fa-solid fa-user-plus"></i></a>
        </div>
      </div>
    </div>
  </section>

  <button class="back-to-top" title="Back to Top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="../js/main.js"></script>
</body>
</html>
